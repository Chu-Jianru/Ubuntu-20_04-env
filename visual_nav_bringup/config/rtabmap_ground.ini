# 地面机器人用的 RTAB-Map 参数备忘。
# Noetic 的 rtabmap.launch 把进程参数放在 args 里，实际生效的是
# launch/realsense_rtabmap.launch 中的 args。改参数时两处一起改。
#
# Reg/Force3DoF=true          只优化平面运动，抑制俯仰和横滚漂移
# Grid/FromDepth=true         用深度图生成二维栅格
# Grid/RayTracing=true        把看见的空闲区域标成可通行
# Grid/3D=false               输出导航用的二维地图
# Grid/CellSize=0.05          栅格 5 厘米
# Grid/RangeMax=4.0           深度参与建图的最远距离（米）
# RGBD/LinearUpdate=0.1       平移超过 10 厘米才插入关键帧
# RGBD/AngularUpdate=0.1      转角超过约 5.7 度才插入关键帧
# Vis/MinInliers=15           视觉内点太少就不要认作一次成功匹配
